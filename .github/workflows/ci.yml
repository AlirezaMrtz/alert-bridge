name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run test suite
        run: uv run pytest -v

      - name: Build Docker image (Sanity Check)
        run: docker build -t alert-bridge:test .

      - name: Smoke Test Container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f alert-bridge-test >/dev/null 2>&1 || true' EXIT
          docker run -d -p 8000:8000 --name alert-bridge-test \
            -v "${{ github.workspace }}/tests/fixtures/valid_config.yaml:/app/config.yaml:ro" \
            -e ALERT_BRIDGE_CONFIG=/app/config.yaml \
            -e MATRIX_TOKEN=ci-matrix-token \
            alert-bridge:test
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs alert-bridge-test
            exit 1
          fi
          status_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/alerts/prometheus-in \
            -H "Content-Type: application/json" \
            -H "X-Secret-Token: supersecrettoken123" \
            -d '{"message": "CI container smoke test"}')
          test "$status_code" -eq 202
          unauthorized_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/alerts/prometheus-in \
            -H "Content-Type: application/json" \
            -d '{"message": "Unauthorized CI smoke test"}')
          test "$unauthorized_code" -eq 401
