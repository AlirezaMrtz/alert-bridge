apiVersion: v1alpha1
sinks:
  - id: bad-sink
    type: webhok
    config:
      url: "https://example.com/webhook"
templates:
  - id: alert-basic
    engine: jinja2
    format: markdown
    body: |
      **Alert**: {{ payload.message }}
routes:
  - id: prometheus-in
    secret_token: "supersecrettoken123"
    template_ref: alert-basic
    forward_to:
      - bad-sink
