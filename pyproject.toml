[project]
name = "alert-bridge"
version = "0.1.0"
description = "A decoupled, secure webhook alerting bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"